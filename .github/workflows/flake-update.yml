name: Weekly flake update

# Every Monday 03:00 UTC: bump all flake inputs (nixpkgs, home-manager,
# hyprland, quickshell, ...), build-verify BOTH the NixOS (snowflake) and
# Home-Manager (quil) configurations, and only push the new flake.lock if
# both still compile. If update+builds fail, the run fails and nothing is
# pushed (you get an Actions failure notification instead of a broken main).
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update flake inputs and verify builds
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Update all flake inputs
        run: nix flake update

      - name: Check whether anything changed
        id: check
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build NixOS system (snowflake)
        if: steps.check.outputs.changed == 'true'
        run: nix build .#nixosConfigurations.snowflake.config.system.build.toplevel --no-link

      - name: Build Home-Manager generation (quil)
        if: steps.check.outputs.changed == 'true'
        run: nix build .#homeConfigurations.quil.activationPackage --no-link

      - name: Commit and push flake.lock
        if: steps.check.outputs.changed == 'true'
        # GITHUB_TOKEN pushes don't re-trigger other workflows, so the pushed
        # lock won't run CI again — the two build steps above already verified
        # it. If you want the push to re-trigger CI, authenticate with a PAT
        # (e.g. secrets.GH_TOKEN) by passing it to actions/checkout instead.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(flake): weekly input update"
          git push origin main