name: CI

# Build-verify every target in the flake: the NixOS hosts (snowflake, moraine,
# the six Proxmox VMs and the five LXCs) and the home-manager targets.
#
# NOTE: the installer-ISO job was removed along with the `installer/` directory
# and the `nixosConfigurations.installer` target.

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '**/*.nix'
      - '**/*.lua'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '**/*.nix'
      - '**/*.lua'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  nixos:
    name: NixOS (${{ matrix.host }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        host:
          - snowflake
          - moraine
          # Proxmox VMs
          - crust
          - baguette
          - scone
          - croissant
          - biscotti
          - biscuit
          # Proxmox LXCs
          - crepe
          - bagel
          - muffin
          - toast
          - macaron
    steps:
      - uses: actions/checkout@v7
        with:
          # Wallpapers is a public submodule; fetch it so the tree is complete.
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build NixOS system (${{ matrix.host }})
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --no-link --print-build-logs

  home:
    name: Home-Manager (${{ matrix.user }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        user:
          - quil@snowflake
          - quil@moraine
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build Home-Manager generation (${{ matrix.user }})
        run: nix build '.#homeConfigurations."${{ matrix.user }}".activationPackage' --no-link --print-build-logs
