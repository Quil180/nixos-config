name: CI

# Build-verify every target in the flake: every nixosConfiguration and every
# homeConfiguration. The matrices are read from the flake itself (the
# `targets` job), so a new host or home target is built with no edit here.
#
# NOTE: the installer-ISO job was removed along with the `installer/` directory
# and the `nixosConfigurations.installer` target.

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '**/*.nix'
      - '**/*.lua'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '**/*.nix'
      - '**/*.lua'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  targets:
    name: Enumerate targets
    runs-on: ubuntu-latest
    outputs:
      nixos: ${{ steps.list.outputs.nixos }}
      home: ${{ steps.list.outputs.home }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - id: list
        run: |
          echo "nixos=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"
          echo "home=$(nix eval --json .#homeConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint (nixfmt, statix, deadnix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build lint checks
        run: nix build .#checks.x86_64-linux.nixfmt .#checks.x86_64-linux.statix .#checks.x86_64-linux.deadnix --no-link --print-build-logs

  nixos:
    name: NixOS (${{ matrix.host }})
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.targets.outputs.nixos) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Wallpapers is a public submodule; fetch it so the tree is complete.
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build NixOS system (${{ matrix.host }})
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --no-link --print-build-logs

  home:
    name: Home-Manager (${{ matrix.user }})
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        user: ${{ fromJSON(needs.targets.outputs.home) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build Home-Manager generation (${{ matrix.user }})
        run: nix build '.#homeConfigurations."${{ matrix.user }}".activationPackage' --no-link --print-build-logs
