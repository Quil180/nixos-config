name: CI

# Build-verify every target in the flake: both NixOS hosts (snowflake,
# moraine) and both home-manager targets (quil@snowflake, quil@moraine).
#
# NOTE: the installer ISO job was removed along with the `installer/`
# directory and the `nixosConfigurations.installer` target. Reinstate a job
# here if an installer target comes back.

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '**/*.nix'
      - '**/*.lua'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '**/*.nix'
      - '**/*.lua'
      - '.github/workflows/**'
  workflow_dispatch:

# Runs in parallel: each job gets its own runner + Nix store.
jobs:
  nixos-snowflake:
    name: NixOS (snowflake)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          # Wallpapers is a public submodule; fetch it so the tree is complete.
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build NixOS system (snowflake)
        run: nix build .#nixosConfigurations.snowflake.config.system.build.toplevel --no-link --print-build-logs

  nixos-moraine:
    name: NixOS (moraine)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build NixOS system (moraine)
        run: nix build .#nixosConfigurations.moraine.config.system.build.toplevel --no-link --print-build-logs

  home-quil-snowflake:
    name: Home-Manager (quil@snowflake)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build Home-Manager generation (quil@snowflake)
        run: nix build '.#homeConfigurations."quil@snowflake".activationPackage' --no-link --print-build-logs

  home-quil-moraine:
    name: Home-Manager (quil@moraine)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build Home-Manager generation (quil@moraine)
        run: nix build '.#homeConfigurations."quil@moraine".activationPackage' --no-link --print-build-logs
